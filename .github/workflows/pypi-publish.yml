name: pypi-publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: build wheel and sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag and VERSION must match
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build --outdir release-dist
          python -m twine check release-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: release-dist/*

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/manim-math-video-studio
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: release-dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-dist
