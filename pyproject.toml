[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-math-video-studio"
dynamic = ["version"]
description = "Installer for the manim-math-video Agent Skill"
readme = "README-pypi.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kappa77" }]
keywords = ["agent-skills", "manim", "video", "claude-code", "codex", "copilot", "pi"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kappa77/manim-math-video-studio"
Repository = "https://github.com/kappa77/manim-math-video-studio"
Documentation = "https://github.com/kappa77/manim-math-video-studio/blob/main/INSTALL.md"
Changelog = "https://github.com/kappa77/manim-math-video-studio/blob/main/CHANGELOG.md"

[project.scripts]
manim-math-video-studio = "manim_math_video_studio:main"
manim-math-video-install = "manim_math_video_studio:main"

[tool.setuptools]
py-modules = ["install"]
packages = ["manim_math_video_studio"]
include-package-data = false

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
